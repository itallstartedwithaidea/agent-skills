name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate skill format
        run: bash scripts/validate-skills.sh

      - name: Count skills
        run: bash scripts/count-skills.sh
